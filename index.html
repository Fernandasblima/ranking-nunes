<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nunes: Só não pode parar</title>
    <style>
        :root { --primary: #2e7d32; --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; --bg: #f8f9fa; --danger: #d32f2f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; }
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 20px 0; height: 120px; }
        .podium-place { display: flex; flex-direction: column; align-items: center; flex: 1; border-radius: 8px 8px 0 0; color: white; font-weight: bold; padding: 10px 5px; text-align: center; font-size: 0.8rem; overflow: hidden; }
        .first { background: var(--gold); height: 100%; color: #333; box-shadow: 0 4px 10px rgba(255,215,0,0.3); }
        .second { background: var(--silver); height: 80%; color: #333; }
        .third { background: var(--bronze); height: 60%; }
        .add-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: #e0e0e0; font-weight: bold; }
        .tab.active { background: var(--primary); color: white; }
        .card { background: white; padding: 12px 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .info { display: flex; flex-direction: column; cursor: pointer; }
        .name { font-weight: bold; text-decoration: underline dotted #ccc; }
        .controls { display: flex; align-items: center; gap: 8px; }
        .btn-round { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .score { font-size: 1.2rem; font-weight: bold; min-width: 30px; text-align: center; }
        .btn-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; padding: 5px; }
        .footer-btns { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .btn-share { background: #25D366; color: white; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<div class="app-container">
    <h2 style="text-align:center">🏆 Só não pode parar</h2>
    <div id="podio-container" class="podium"></div>
    <div class="add-box">
        <input type="text" id="novoNome" placeholder="Novo participante...">
        <button class="btn-add" onclick="adicionar()">Adicionar</button>
    </div>
    <div class="tabs">
        <button class="tab active" id="tab-ativos" onclick="filtrar('ativos')">Ativos</button>
        <button class="tab" id="tab-inativos" onclick="filtrar('inativos')">Inativos</button>
    </div>
    <div id="lista"></div>
    <div class="footer-btns">
        <button class="btn-share" onclick="compartilhar()">Enviar Ranking no WhatsApp</button>
        <button style="background:none; border:none; color:#999; cursor:pointer; font-size: 0.8rem;" onclick="resetar()">Zerar Pontos de Todos</button>
    </div>
</div>

<!-- Firebase SDK via CDN -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>

<script>
  // 🔧 Suas credenciais do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyA8zj2p59Q4u9QQNVbBwh2mvgO16mMr-og",
    authDomain: "ranking-nunes.firebaseapp.com",
    databaseURL: "https://ranking-nunes-default-rtdb.firebaseio.com",
    projectId: "ranking-nunes",
    storageBucket: "ranking-nunes.firebasestorage.app",
    messagingSenderId: "28397645334",
    appId: "1:28397645334:web:ce62f1de12efc987a90f37",
    measurementId: "G-EKGPPTT8Z5"
  };

  // Inicializar Firebase
  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let participantes = [];
  let filtro = 'ativos';

  // Carregar dados em tempo real
  db.ref("participantes").on("value", snapshot => {
    participantes = snapshot.val() || [];
    renderizar();
  });

  function salvar() {
    db.ref("participantes").set(participantes);
  }

  function adicionar() {
    const input = document.getElementById('novoNome');
    if (!input.value) return;
    participantes.push({ nome: input.value, pontos: 0, status: 'ativos' });
    input.value = '';
    salvar();
  }

  function editarNome(index) {
    const novoNome = prompt("Editar nome:", participantes[index].nome);
    if (novoNome) {
      participantes[index].nome = novoNome;
      salvar();
    }
  }

  function excluir(index) {
    if (confirm(`Excluir ${participantes[index].nome} da lista?`)) {
      participantes.splice(index, 1);
      salvar();
    }
  }

  function alterarPontos(index, valor) {
    participantes[index].pontos += valor;
    if (participantes[index].pontos < 0) participantes[index].pontos = 0;
    if (participantes[index].pontos > 0) participantes[index].status = 'ativos';
    salvar();
  }

  function mudarStatus(index) {
    participantes[index].status = participantes[index].status === 'ativos' ? 'inativos' : 'ativos';
    salvar();
  }

  function filtrar(f) {
    filtro = f;
    document.getElementById('tab-ativos').classList.toggle('active', f === 'ativos');
    document.getElementById('tab-inativos').classList.toggle('active', f === 'inativos');
    renderizar();
  }

  function renderizar() {
    const listaDiv = document.getElementById('lista');
    const podioDiv = document.getElementById('podio-container');
    listaDiv.innerHTML = '';
    
    const ordenados = [...participantes].sort((a, b) => b.pontos - a.pontos);

    // Pódio
    podioDiv.innerHTML = `
        <div class="podium-place second">🥈 2º<br>${ordenados[1]?.nome || '-'}</div>
        <div class="podium-place first">🥇 1º<br>${ordenados[0]?.nome || '-'}</div>
        <div class="podium-place third">🥉 3º<br>${ordenados[2]?.nome || '-'}</div
